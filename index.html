<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Sharing - Study Resources</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-pending">
    <header class="header">
        <div class="container">
            <h1><img src="logo.png" alt="Vinayak Academy logo" class="logo"><span>Vinayak Academy And IT Solutions</span></h1>
            <p>Access all your study materials in one place</p>
            <video autoplay muted loop playsinline class="video-bg">
                <source src="https://www.pexels.com/download/video/6803042/" type="video/mp4">
            </video>
        </div>
    </header>

    <main class="container">
        <section class="subjects-grid" id="subjectsGrid">
            <!-- Subjects will be rendered here by JavaScript -->
        </section>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle"></h2>
            <div id="topicsContainer" class="topics-list"></div>
        </div>
    </div>

    <footer class="footer">
 <p>&copy; 2026 Vinayak Academy And IT Solutions. All rights reserved.
           <br> developed by <a href="https://www.instagram.com/vinayak_it_solutions_?igsh=ODNmZDhsZGpuaXM4" target="_blank" rel="noopener noreferrer">Vinayak IT Solutions</a>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="JS/supabase-config.js"></script>
    <script src="JS/auth.js"></script>
    <script>
        window.VinayakAuth.initProtectedPage();

        document.addEventListener("DOMContentLoaded", function () {
            const courses = window.VinayakAuth.getStoredCourses();

            if (!courses.includes("ECCE")) {
                const ecceCard = document.getElementById("ecce-card");
                if (ecceCard) {
                    ecceCard.style.display = "none";
                }
            }

            if (!courses.includes("ADFA")) {
                const adfaCard = document.getElementById("adfa-card");
                if (adfaCard) {
                    adfaCard.style.display = "none";
                }
            }

            if (!courses.includes("DCFA")) {
                const dcfaCard = document.getElementById("dcfa-card");
                if (dcfaCard) {
                    dcfaCard.style.display = "none";
                }
            }
        });
    </script>
    <script src="JS/notes-page.js"></script>
    <script src="JS/script.js"></script>
</body>
</html>
