<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare R2 Test - Vinayak Academy</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        body.r2-test-page {
            min-height: 100vh;
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .r2-test-shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 18px;
        }
        .r2-test-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
            padding: 24px;
        }
        .r2-test-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 22px 0;
        }
        .r2-test-actions button {
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            padding: 12px 16px;
        }
        .r2-test-actions button:hover {
            background: #1d4ed8;
        }
        #r2TestOutput {
            min-height: 320px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            background: #0f172a;
            color: #dbeafe;
            border-radius: 14px;
            padding: 16px;
            line-height: 1.55;
        }
    </style>
</head>
<body class="auth-pending r2-test-page">
    <main class="r2-test-shell">
        <section class="r2-test-card">
            <h1>Cloudflare R2 Diagnostics</h1>
            <p>Admin-only diagnostics for the private R2 bucket. This page is not linked in navigation.</p>
            <div class="r2-test-actions">
                <button type="button" data-r2-test="credentials">Test Credentials</button>
                <button type="button" data-r2-test="bucket">Test Bucket</button>
                <button type="button" data-r2-test="upload">Upload Test File</button>
                <button type="button" data-r2-test="list">List Bucket Files</button>
            </div>
            <pre id="r2TestOutput">Click a button to run a Cloudflare R2 diagnostic.</pre>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="JS/supabase-config.js"></script>
        <script src="JS/api-config.js"></script>
<script src="JS/auth.js"></script>
    <script src="JS/admin-r2-test.js"></script>
</body>
</html>
