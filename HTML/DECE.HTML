<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Sharing - Study Resources</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1><i class="fas fa-book"></i>Vinayak Academy And It Soultions</h1>
            <p>Access all your study materials in one place</p>
        </div>
    </header>

    <main class="container">
        <section class="subjects-grid" id="subjectsGridDECE">
            <!-- Subjects will be rendered here by JavaScript -->
        </section>
    </main>

    <!-- Modal for viewing topics -->
    <div id="modalDECE" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitleDECE"></h2>
            <div id="topicsContainerDECE" class="topics-list">
                <!-- Topics will be rendered here -->
            </div>
        </div>
    </div>
<marquee class="student-marquee" behavior="scroll" direction="left">
        Vinayak Academy - Notes are for enrolled students only | Do not share
    </marquee>
    <footer class="footer">
        <p>&copy; 2026 Notes Sharing. All rights reserved.</p>
    </footer>
    <script> 
    if (localStorage.getItem("loggedIn") !== "true") {
            window.location.href = "/HTML/login.html";
        }
        </script>
    <script src="/JS/DECE.JS"></script>
</body>
</html>
