<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECCE Student Login - Vinayak Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            padding: 2rem;
        }

        .login-box h2 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .login-box p {
            color: var(--text-light);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .login-field {
            margin-bottom: 1rem;
        }

        .login-field label {
            display: block;
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .login-field input {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.8rem 0.9rem;
            font: inherit;
            color: #1f2937;
            outline: none;
        }

        .login-field input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(229, 134, 65, 0.2);
        }

        .login-btn {
            width: 100%;
            border: 0;
            border-radius: 6px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.85rem 1rem;
            margin-top: 0.5rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            color: var(--primary-color);
            font-weight: 700;
            text-decoration: none;
            margin-top: 1rem;
        }

        @media (max-width: 480px) {
            .login-main {
                padding: 1rem;
            }

            .login-box {
                padding: 1.4rem;
            }

            .login-box h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1><i class="fas fa-book"></i>Vinayak Academy And IT Solutions</h1>
            <p>ECCE enrolled student access</p>
        </div>
    </header>

    <main class="login-main">
        <section class="login-box">
            <h2>ECCE Login</h2>
            <p>Enter your student details to view notes.</p>

            <form id="loginForm">
                <div class="login-field">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" autocomplete="username" required>
                </div>

                <div class="login-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-right-to-bracket"></i> Login
                </button>
            </form>

            <a href="/HTML/index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </section>
    </main>

    <script>
        const students = [
            { id: "student1", pass: "1234" },
            { id: "monikaswami", pass: "monika@1234" }
        ];

        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const studentId = document.getElementById("studentId").value.trim();
            const password = document.getElementById("password").value.trim();

            const validStudent = students.find(function (student) {
                return student.id === studentId && student.pass === password;
            });

            if (validStudent) {
                localStorage.setItem("loggedIn", "true");
                localStorage.setItem("studentId", validStudent.id);
                window.location.href = "/HTML/DECE.html";
            } else {
                alert("Invalid ID or Password");
            }
        });
    </script>
</body>
</html>
