<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Vinayak Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="student-portal.css">
</head>
<body class="auth-pending student-dashboard-page">
    <main class="student-shell">
        <section class="student-alert" id="studentBlockedBanner" hidden>
            <i class="fas fa-triangle-exclamation"></i>
            <span>Your account has a pending or overdue EMI. Please complete payment to avoid access restrictions.</span>
        </section>

        <section class="student-home-summary">
            <div>
                <span>Welcome</span>
                <h1 data-home-student-name>Student</h1>
            </div>
            <div class="student-home-meta">
                <article><small>Course</small><strong data-home-course>-</strong></article>
                <article><small>Batch</small><strong data-home-batch>-</strong></article>
               
               
            </div>
        </section>

        <section class="student-launcher" id="dashboard">
            <div class="student-section-head slim">
                <div>
                    <h2>Quick Actions</h2>
                    <span>Go directly to the sections students use most.</span>
                </div>
            </div>
            <div class="student-quick-grid student-primary-actions" id="studentQuickGrid"></div>
        </section>

        <section class="student-dashboard-grid compact-grid">
            <article class="student-panel" id="announcementPanel">
                <div class="student-section-head slim"><div><h2>Latest Announcements</h2><span>Important updates in one place.</span></div></div>
                <div class="student-list" id="announcementList"><div class="student-skeleton"></div><div class="student-skeleton"></div></div>
            </article>
            
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="JS/supabase-config.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/announcements.js"></script>
    <script src="JS/student-layout.js?v=student-attendance-course-only-20260716"></script>
    <script src="JS/notes-page.js"></script>
    <script src="JS/pdf-modal-viewer.js"></script>
    <script src="JS/script.js?v=student-attendance-course-only-20260716"></script>
    <script>
        window.VinayakAuth.initProtectedPage().then(function (session) {
            if (session && window.VinayakStudentDashboard) {
                window.VinayakStudentDashboard.load(session);
            }
        });
    </script>
</body>
</html>
